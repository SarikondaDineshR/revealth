services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revealth-postgres
    environment:
      POSTGRES_USER: revealth
      POSTGRES_PASSWORD: revealth
      POSTGRES_DB: revealth
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revealth -d revealth"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: revealth-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: revealth
      POSTGRES_PWD: revealth
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal-config/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: revealth-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:4000
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: revealth-api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://revealth:revealth@postgres:5432/revealth?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      API_HOST: 0.0.0.0
      EXECUTOR_URL: http://executor:4100
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  executor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.executor
    container_name: revealth-executor
    env_file:
      - .env
    environment:
      EXECUTOR_HOST: 0.0.0.0
      EXECUTOR_PORT: 4100
      EXECUTOR_REPOSITORY_PATH: /workspace
    volumes:
      - .:/workspace
    ports:
      - "4100:4100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: revealth-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://revealth:revealth@postgres:5432/revealth?schema=public
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');try{const s=fs.statSync('/tmp/revealth-worker-ready');process.exit(Date.now()-s.mtimeMs<30000?0:1)}catch{process.exit(1)}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:

