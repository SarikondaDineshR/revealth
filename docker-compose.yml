services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revealth-postgres
    environment:
      POSTGRES_USER: revealth
      POSTGRES_PASSWORD: revealth
      POSTGRES_DB: revealth
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revealth -d revealth"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: revealth-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: revealth
      POSTGRES_PWD: revealth
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal-config/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: revealth-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:4000
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: revealth-api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://revealth:revealth@postgres:5432/revealth?schema=public
      TEMPORAL_ADDRESS: temporal:7233
      API_HOST: 0.0.0.0
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: revealth-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://revealth:revealth@postgres:5432/revealth?schema=public
      TEMPORAL_ADDRESS: temporal:7233

volumes:
  postgres-data:

